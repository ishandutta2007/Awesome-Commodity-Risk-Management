<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>

    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#db6d28"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes waveMove {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }
    .wave-bg { animation: waveMove 10s ease-in-out infinite; }
    .dot-1 { animation: pulseDot 3s ease-in-out infinite; transform-origin: 720px 110px; }
    .dot-2 { animation: pulseDot 3s ease-in-out infinite 1.5s; transform-origin: 820px 75px; }
    .pill-float { animation: floatPill 6s ease-in-out infinite; }
  </style>

  <!-- Main Dark Canvas -->
  <rect width="900" height="260" rx="12" fill="url(#bgGradient)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Background Grid Lines -->
  <g opacity="0.15">
    <line x1="50" y1="50" x2="850" y2="50" stroke="#8b949e" stroke-dasharray="4,4"/>
    <line x1="50" y1="110" x2="850" y2="110" stroke="#8b949e" stroke-dasharray="4,4"/>
    <line x1="50" y1="170" x2="850" y2="170" stroke="#8b949e" stroke-dasharray="4,4"/>
    <line x1="50" y1="230" x2="850" y2="230" stroke="#8b949e" stroke-dasharray="4,4"/>
  </g>

  <!-- Animated Background Wave / Chart Area (Placed strictly behind foreground text card) -->
  <g class="wave-bg" opacity="0.4">
    <path d="M 50,190 Q 200,120 350,160 T 650,100 T 850,75 L 850,230 L 50,230 Z" fill="url(#chartGradient)"/>
    <path d="M 50,190 Q 200,120 350,160 T 650,100 T 850,75" fill="none" stroke="url(#glowLine)" stroke-width="3" filter="url(#glow)"/>
  </g>

  <!-- Animated Data Points in Background -->
  <circle class="dot-1" cx="720" cy="110" r="5" fill="#3fb950"/>
  <circle class="dot-2" cx="820" cy="75" r="5" fill="#58a6ff"/>

  <!-- Decorative Animated Pills on Right Side -->
  <g class="pill-float" opacity="0.85">
    <rect x="680" y="165" width="85" height="26" rx="13" fill="#21262d" stroke="#30363d"/>
    <text x="722.5" y="182" fill="#3fb950" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CTRM</text>

    <rect x="775" y="165" width="85" height="26" rx="13" fill="#21262d" stroke="#30363d"/>
    <text x="817.5" y="182" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">ETRM</text>
  </g>

  <!-- Foreground Solid Card Backdrop ensuring Title and Subtitle stay 100% visible -->
  <rect x="35" y="35" width="620" height="190" rx="10" fill="#0d1117" fill-opacity="0.9" stroke="#30363d" stroke-width="1"/>

  <!-- Foreground Title and Subtitle -->
  <g>
    <!-- Tag -->
    <rect x="55" y="52" width="145" height="24" rx="12" fill="#238636" fill-opacity="0.25" stroke="#2ea043" stroke-width="1"/>
    <text x="127.5" y="68" fill="#3fb950" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="55" y="118" fill="url(#titleGradient)" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">Awesome Commodity Risk</text>
    <text x="55" y="152" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Management</text>

    <!-- Subtitle -->
    <text x="55" y="185" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">
      Curated list of SaaS platforms, ETRM/CTRM systems &amp; open-source quantitative risk tools
    </text>
    <text x="55" y="205" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
      Position Management • Valuation • Credit Risk • Energy &amp; Derivatives
    </text>
  </g>
</svg>
